name: Hoplid CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hoplid
          POSTGRES_PASSWORD: hoplid_local_only
          POSTGRES_DB: hoplid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoplid -d hoplid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://hoplid:hoplid_local_only@localhost:5432/hoplid_test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start API for integration tests
        env:
          API_URL: http://127.0.0.1:8001
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/hoplid-api.log 2>&1 &
          echo $! > /tmp/hoplid-api.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/health/ready; then
              echo
              echo "API readiness check passed."
              exit 0
            fi
            sleep 2
          done

          echo "API failed to become ready. Server logs:"
          cat /tmp/hoplid-api.log
          exit 1

      - name: Run tests
        env:
          API_URL: http://127.0.0.1:8001
          TEST_DATABASE_URL: postgresql://hoplid:hoplid_local_only@localhost:5432/hoplid_test
        run: python -m pytest -q

  build-and-scan:
    name: Build and scan container
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hoplid-api:${GITHUB_SHA} .

      - name: Scan filesystem for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hoplid-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  publish:
    name: Publish immutable image
    runs-on: ubuntu-latest
    needs: [test, build-and-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hoplid-api:${GITHUB_SHA} .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/hoplid-api
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/hoplid-api"
          docker tag "hoplid-api:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
