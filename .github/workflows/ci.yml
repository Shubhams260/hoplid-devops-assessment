name: Hoplid CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit and order API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hoplid
          POSTGRES_PASSWORD: hoplid_local_only
          POSTGRES_DB: hoplid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoplid -d hoplid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hoplid:hoplid_local_only@localhost:5432/hoplid_test
      TEST_DATABASE_URL: postgresql://hoplid:hoplid_local_only@localhost:5432/hoplid_test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q -p no:cacheprovider tests/test_unit.py
      - name: Start API for integration tests
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/hoplid-api.log 2>&1 &
          echo $! > /tmp/hoplid-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/health/ready; then
              echo "API readiness check passed."
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready. Server logs:"
          cat /tmp/hoplid-api.log
          exit 1
      - name: Run integration tests
        run: python -m pytest -q -p no:cacheprovider tests/test_orders_integration.py
        env:
          API_URL: http://127.0.0.1:8001
          TEST_DATABASE_URL: postgresql://hoplid:hoplid_local_only@localhost:5432/hoplid_test
      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hoplid-ci-api-log
          path: /tmp/hoplid-api.log
          if-no-files-found: ignore

  migration-test:
    name: Legacy schema migration test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hoplid
          POSTGRES_PASSWORD: hoplid_local_only
          POSTGRES_DB: hoplid_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoplid -d hoplid_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hoplid:hoplid_local_only@localhost:5432/hoplid_migration_test
      MIGRATION_TEST_DB_URL: postgresql://hoplid:hoplid_local_only@localhost:5432/hoplid_migration_test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Seed representative legacy schema and rows
        run: |
          python - <<'PY'
          import os
          import psycopg

          rows = [
              ("11111111-1111-4111-8111-111111111111", "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa", "confirmed"),
              ("22222222-2222-4222-8222-222222222222", "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb", "preparing"),
              ("33333333-3333-4333-8333-333333333333", "cccccccc-cccc-4ccc-8ccc-cccccccccccc", "legacy_unmapped"),
          ]
          with psycopg.connect(os.environ["MIGRATION_TEST_DB_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      CREATE TABLE orders (
                          id UUID PRIMARY KEY,
                          user_id UUID NOT NULL,
                          status TEXT NOT NULL,
                          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
                      )
                  """)
                  cur.executemany(
                      "INSERT INTO orders (id, user_id, status) VALUES (%s, %s, %s)",
                      rows,
                  )
          print(f"Seeded {len(rows)} legacy orders.")
          PY
      - name: Apply all Alembic migrations
        run: alembic upgrade head
      - name: Verify backfill and preservation
        run: |
          python - <<'PY'
          import os
          import psycopg

          expected = {
              "11111111-1111-4111-8111-111111111111": ("confirmed", 2),
              "22222222-2222-4222-8222-222222222222": ("preparing", 3),
              "33333333-3333-4333-8333-333333333333": ("legacy_unmapped", 0),
          }
          with psycopg.connect(os.environ["MIGRATION_TEST_DB_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT id::text, status, status_code, idempotency_key, request_hash FROM orders")
                  actual = {row[0]: row[1:] for row in cur.fetchall()}
          assert set(actual) == set(expected), f"Unexpected IDs: {set(actual)}"
          for order_id, (status, code) in expected.items():
              row_status, row_code, idem_key, request_hash = actual[order_id]
              assert row_status == status, (order_id, row_status)
              assert row_code == code, (order_id, row_code)
              assert idem_key == f"legacy:{order_id}", (order_id, idem_key)
              assert len(request_hash) == 64, (order_id, request_hash)
          print("PASS: migrations preserve legacy status text and backfill status_code/idempotency fields.")
          PY

  build-and-scan:
    name: Build and scan container
    runs-on: ubuntu-latest
    needs: [test, migration-test]
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull -t hoplid-api:${GITHUB_SHA} .
      - name: Scan filesystem dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hoplid-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  publish:
    name: Publish immutable image
    runs-on: ubuntu-latest
    needs: [test, migration-test, build-and-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull -t hoplid-api:${GITHUB_SHA} .
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push immutable image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/hoplid-api"
          docker tag "hoplid-api:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "Published ${IMAGE}:${GITHUB_SHA}"
