
apiVersion: v1
kind: Secret
metadata:
  name: hoplid-drain
type: Opaque
stringData:
  token: "local-drain-token-change-before-production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoplid-api
  labels:
    app: hoplid-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hoplid-api
  template:
    metadata:
      labels:
        app: hoplid-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: hoplid-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hoplid-db
                  key: database-url
            - name: DRAIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hoplid-drain
                  key: token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    python -c "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/internal/drain', data=b'', headers={'X-Drain-Token': __import__('os').environ['DRAIN_TOKEN']}, method='POST'); urllib.request.urlopen(req, timeout=2)"
                    sleep 5
---
apiVersion: v1
kind: Service
metadata:
  name: hoplid-api
spec:
  selector:
    app: hoplid-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
